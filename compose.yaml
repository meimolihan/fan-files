services:
  filebrowser:
    container_name: filebrowser
    build: .
    image: filebrowser:local
    restart: unless-stopped
    networks:
      - filebrowser
    ports:
      - 8678:80
    volumes:
      - filebrowser:/flux/vault
    command:
      - --root=/flux/vault
    environment:
      - FB_REDIS_CACHE_URL=redis://default:filebrowser@redis:6379 # Use rediss:// for ssl

  redis:
    container_name: redis
    image: redis:latest
    restart: unless-stopped
    networks:
      - filebrowser
    command:
      - sh
      - -c
      - |
        cat > /tmp/users.acl <<EOF
        user default on >filebrowser ~* +@all
        EOF
        redis-server --aclfile /tmp/users.acl

networks:
  filebrowser:

volumes:
  filebrowser:
