<svg width="960" height="960" viewBox="0 0 960 960" xmlns="http://www.w3.org/2000/svg">
  <!-- 圆角白色背景 -->
  <rect width="960" height="960" rx="180" fill="#ffffff"/>
  <!-- 四个带阴影的圆形 -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-opacity="0.22"/>
    </filter>
  </defs>
  <!-- 绿色圆 -->
  <circle cx="480" cy="270" r="150" fill="#27b84b" filter="url(#shadow)"/>
  <!-- 橙色圆 -->
  <circle cx="270" cy="480" r="150" fill="#f28522" filter="url(#shadow)"/>
  <!-- 红色圆 -->
  <circle cx="690" cy="480" r="150" fill="#e64c37" filter="url(#shadow)"/>
  <!-- 蓝色圆 -->
  <circle cx="480" cy="690" r="150" fill="#2374c9" filter="url(#shadow)"/>
</svg>
