name: Release Pipeline

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的标签 (例如: v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  DOCKERHUB_IMAGE: mobufan/fan-files
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-binaries:
    name: 编译二进制 (linux amd64 + arm64 + 内置前端)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      built: ${{ steps.build.outputs.built }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ format('refs/tags/{0}', github.event.inputs.tag) }}

      - name: Validate tag format
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ ! "${{ github.event.inputs.tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
            echo "错误: 标签格式无效，必须以 'v' 开头，例如: v1.0.0"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'

      - name: Build frontend assets
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          CI=true pnpm run build

      - name: Read version from version.go
        id: ver
        run: echo "ver=$(sed -n 's/.*Version = "\(.*\)"/\1/p' version/version.go | head -1)" >> "$GITHUB_OUTPUT"

      - name: Build Go binary (linux/amd64)
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p bin
          go build -buildvcs=false -trimpath \
            -ldflags="-s -w -X github.com/meimolihan/fan-files/version.CommitSHA=${GITHUB_SHA:0:7}" \
            -o bin/fan-files_linux_amd64 .
          ./bin/fan-files_linux_amd64 version

      - name: Build Go binary (linux/arm64)
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
        run: |
          go build -buildvcs=false -trimpath \
            -ldflags="-s -w -X github.com/meimolihan/fan-files/version.CommitSHA=${GITHUB_SHA:0:7}" \
            -o bin/fan-files_linux_arm64 .

      - name: Verify build outputs
        id: build
        run: |
          set -e
          ls -lh bin/fan-files_linux_amd64 bin/fan-files_linux_arm64
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Upload binaries as artifacts
        if: steps.build.outputs.built == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: fan-files-binaries
          path: |
            bin/fan-files_linux_amd64
            bin/fan-files_linux_arm64
          if-no-files-found: error

  publish-release:
    name: 发布 Release (附带二进制)
    needs: build-binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ format('refs/tags/{0}', github.event.inputs.tag) }}

      - name: Download binaries
        if: needs.build-binaries.outputs.built == 'true'
        uses: actions/download-artifact@v7
        with:
          name: fan-files-binaries
          path: bin

      - name: Prepare release body
        run: |
          if [ -f RELEASE_NOTES.md ]; then
            cp RELEASE_NOTES.md _release_body.md
          else
            {
              echo "Fan-Files ${{ env.RELEASE_TAG }}"
              echo ""
              echo "Docker 镜像："
              echo "  - Docker Hub：docker pull ${{ env.DOCKERHUB_IMAGE }}:${{ env.RELEASE_TAG }}"
              echo "  - GHCR：docker pull ${{ env.GHCR_IMAGE }}:${{ env.RELEASE_TAG }}"
            } > _release_body.md
          fi

      - name: Create / update Release with binaries
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          FILES=""
          [ -f bin/fan-files_linux_amd64 ] && FILES="$FILES bin/fan-files_linux_amd64"
          [ -f bin/fan-files_linux_arm64 ] && FILES="$FILES bin/fan-files_linux_arm64"
          gh release create "$TAG" \
            --title "Fan-Files $TAG" \
            --notes-file _release_body.md \
            $FILES
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-docker:
    name: 构建推送 Docker 镜像 (Docker Hub + GHCR)
    needs: publish-release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ format('refs/tags/{0}', github.event.inputs.tag) }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          VER="${{ env.RELEASE_TAG }}"
          VER_NO_V="${VER#v}"
          TAGS="${{ env.DOCKERHUB_IMAGE }}:${VER},${{ env.DOCKERHUB_IMAGE }}:latest"
          TAGS="${TAGS},${{ env.GHCR_IMAGE }}:${VER},${{ env.GHCR_IMAGE }}:${VER_NO_V}"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker images
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sync-cnb:
    name: 同步到 CNB 镜像仓库
    needs: build-docker
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ format('refs/tags/{0}', github.event.inputs.tag) }}

      - name: Sync to CNB Repository
        if: ${{ env.CNB_TOKEN != '' }}
        env:
          CNB_TOKEN: ${{ secrets.CNB_ACCESS_TOKEN }}
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:${{ github.workspace }} \
            -w ${{ github.workspace }} \
            -e PLUGIN_TARGET_URL="https://cnb.cool/meimolihan/fan-files.git" \
            -e PLUGIN_AUTH_TYPE="https" \
            -e PLUGIN_USERNAME="cnb" \
            -e PLUGIN_PASSWORD="$CNB_TOKEN" \
            -e PLUGIN_FORCE="true" \
            -e PLUGIN_PUSH_TAGS="true" \
            tencentcom/git-sync

      - name: Skip CNB sync
        if: ${{ env.CNB_TOKEN == '' }}
        env:
          CNB_TOKEN: ${{ secrets.CNB_ACCESS_TOKEN }}
        run: echo "::warning::CNB_ACCESS_TOKEN 未配置，跳过同步到 CNB 镜像仓库"