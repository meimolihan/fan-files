name: Release

# 推送 v 开头 tag（由 scripts/build-and-push.sh 打出）时自动：
#   1) 编译并创建 GitHub Release（fan-files_linux_amd64 / fan-files_linux_arm64）
#   2) 构建并推送 multi-arch Docker 镜像（mobufan/fan-files:latest + 版本标签）
# 一次发版只产生一条 workflow run（jobs: release -> docker）。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  IMAGE_NAME: mobufan/fan-files

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Build frontend assets
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          CI=true pnpm run build

      - name: Read version from version.go
        id: ver
        run: echo "ver=$(sed -n 's/.*Version = "\(.*\)"/\1/p' version/version.go | head -1)" >> "$GITHUB_OUTPUT"

      - name: Build Go binary (linux/amd64)
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p bin
          go build -buildvcs=false -trimpath \
            -ldflags="-s -w -X github.com/meimolihan/fan-files/version.CommitSHA=${GITHUB_SHA:0:7}" \
            -o bin/fan-files_linux_amd64 .
          ./bin/fan-files_linux_amd64 version

      - name: Build Go binary (linux/arm64)
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
        run: |
          go build -buildvcs=false -trimpath \
            -ldflags="-s -w -X github.com/meimolihan/fan-files/version.CommitSHA=${GITHUB_SHA:0:7}" \
            -o bin/fan-files_linux_arm64 .

      - name: List release assets
        run: ls -lh bin/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/fan-files_linux_amd64
            bin/fan-files_linux_arm64
          generate_release_notes: true

  docker:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          push-to-registry: true